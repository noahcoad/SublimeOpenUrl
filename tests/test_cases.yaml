# ─────────────────────────────────────────────────────────────────────────────
# find_selection cases
# cursor: integer position in text
# selection: [a, b] pre-existing range (mutually exclusive with cursor)
# expected: what find_selection() expands/returns after strip()
# ─────────────────────────────────────────────────────────────────────────────
selection_cases:

  # standalone URLs
  - {label: domain-bare,        text: "google.com",                  cursor: 3, expected: "google.com"}
  - {label: domain-with-path,   text: "coad.net/noah",               cursor: 3, expected: "coad.net/noah"}
  - {label: https-url,          text: "https://example.com/path",    cursor: 5, expected: "https://example.com/path"}
  - {label: https-complex,      text: "https://amazonaus.sharepoint.com/:x:/r/sites/foo?d=abc&csf=1", cursor: 5,
     expected: "https://amazonaus.sharepoint.com/:x:/r/sites/foo?d=abc&csf=1"}
  - {label: sharepoint-colon-x-mid-cursor, text: "https://amazon.sharepoint.com/:x:/s/Intuit/IQCQGlsx38hzRq2jXt9SDmQSAXgqLmKTeVgRWh6a5wdHm9A?e=X0EnJ3", cursor: 20,
     expected: "https://amazon.sharepoint.com/:x:/s/Intuit/IQCQGlsx38hzRq2jXt9SDmQSAXgqLmKTeVgRWh6a5wdHm9A?e=X0EnJ3"}

  # standalone file paths
  - {label: tilde-path,         text: "~/code/notes.txt",            cursor: 3, expected: "~/code/notes.txt"}
  - {label: abs-path,           text: "/Users/ncoad/notes.txt",      cursor: 5, expected: "/Users/ncoad/notes.txt"}
  - {label: abs-path-line-num,  text: "/Users/ncoad/notes.txt:5",    cursor: 5, expected: "/Users/ncoad/notes.txt:5"}
  - {label: abs-path-search,    text: '/Users/ncoad/notes.txt:"change log"', cursor: 5,
     expected: '/Users/ncoad/notes.txt:"change log"'}

  # deep links whose regex/search body holds spaces and quotes
  - {label: deep-link-spacey-start, text: 'stream.md:6:/^# 2026-08-05 "The Containment Brothers"/', cursor: 0,
     expected: 'stream.md:6:/^# 2026-08-05 "The Containment Brothers"/'}
  - {label: deep-link-spacey-in-quotes, text: 'stream.md:6:/^# 2026-08-05 "The Containment Brothers"/', cursor: 41,
     expected: 'stream.md:6:/^# 2026-08-05 "The Containment Brothers"/'}
  - {label: deep-link-spacey-in-prose, text: 'see stream.md:6:/^# 2026-08-05 "The Containment Brothers"/ now', cursor: 34,
     expected: 'stream.md:6:/^# 2026-08-05 "The Containment Brothers"/'}
  - {label: deep-link-regex-trailing-colon, text: '/tmp/f.py:12:/^def foo\(x\):/', cursor: 20,
     expected: '/tmp/f.py:12:/^def foo\(x\):/'}
  - {label: deep-link-search-space, text: '/tmp/f.md:3:"hello world"', cursor: 18,
     expected: '/tmp/f.md:3:"hello world"'}

  # paths with spaces wrapped in each enclosing pair (quotes AND brackets)
  - {label: pair-single-quote, text: "'~/OneDrive/Q CST - ALL/3M'", cursor: 9, expected: "~/OneDrive/Q CST - ALL/3M"}
  - {label: pair-double-quote, text: '"~/OneDrive/Q CST - ALL/3M"', cursor: 9, expected: "~/OneDrive/Q CST - ALL/3M"}
  - {label: pair-backtick,     text: "`~/OneDrive/Q CST - ALL/3M`", cursor: 9, expected: "~/OneDrive/Q CST - ALL/3M"}
  - {label: pair-brace,        text: "{~/OneDrive/Q CST - ALL/3M}", cursor: 9, expected: "~/OneDrive/Q CST - ALL/3M"}
  - {label: pair-paren,        text: "(~/OneDrive/Q CST - ALL/3M)", cursor: 9, expected: "~/OneDrive/Q CST - ALL/3M"}
  - {label: pair-bracket,      text: "[~/OneDrive/Q CST - ALL/3M]", cursor: 9, expected: "~/OneDrive/Q CST - ALL/3M"}
  - {label: pair-angle,        text: "<~/OneDrive/Q CST - ALL/3M>", cursor: 9, expected: "~/OneDrive/Q CST - ALL/3M"}
  # cursor late in the token (past a space) still grabs the whole wrapped path
  - {label: pair-bracket-late, text: "[~/OneDrive/Q CST - ALL/3M]", cursor: 24, expected: "~/OneDrive/Q CST - ALL/3M"}
  # innermost pair wins when pairs nest
  - {label: pair-nested-inner, text: 'x ("~/a b/c.txt") y', cursor: 8, expected: "~/a b/c.txt"}
  - {label: pair-in-html-attr, text: "<a href='~/a b.txt'>", cursor: 13, expected: "~/a b.txt"}
  - {label: pair-in-json,      text: '{"path": "~/a b.txt"}', cursor: 13, expected: "~/a b.txt"}
  # ${VAR} braces are part of the path, never a delimiter pair
  - {label: var-brace-path,    text: "${HOME}/Desktop", cursor: 3,  expected: "${HOME}/Desktop"}
  - {label: var-brace-late,    text: "${HOME}/Desktop", cursor: 12, expected: "${HOME}/Desktop"}
  - {label: var-brace-deeplink, text: "${HOME}/a.txt:/^foo bar/", cursor: 18, expected: "${HOME}/a.txt:/^foo bar/"}
  # markdown link targets
  - {label: md-link-url,       text: "- [label](http://example.com) x", cursor: 20, expected: "http://example.com"}
  - {label: md-link-path,      text: "see [docs](~/txt/notes.txt) here", cursor: 15, expected: "~/txt/notes.txt"}
  # cursor anywhere in the link — bracket, label, or target — resolves the target
  - {label: md-link-on-open-bracket, text: "[bits - OneDrive](https://a.sharepoint.com/x?id=%2Fa%20b&v=1)", cursor: 0,
     expected: "https://a.sharepoint.com/x?id=%2Fa%20b&v=1"}
  - {label: md-link-label-start, text: "[bits - OneDrive](https://a.sharepoint.com/x?id=%2Fa%20b&v=1)", cursor: 1,
     expected: "https://a.sharepoint.com/x?id=%2Fa%20b&v=1"}
  - {label: md-link-label-space, text: "[bits - OneDrive](https://a.sharepoint.com/x?id=%2Fa%20b&v=1)", cursor: 6,
     expected: "https://a.sharepoint.com/x?id=%2Fa%20b&v=1"}
  - {label: md-link-close-bracket, text: "[bits - OneDrive](https://a.sharepoint.com/x?id=%2Fa%20b&v=1)", cursor: 16,
     expected: "https://a.sharepoint.com/x?id=%2Fa%20b&v=1"}
  - {label: md-link-open-paren, text: "[bits - OneDrive](https://a.sharepoint.com/x?id=%2Fa%20b&v=1)", cursor: 17,
     expected: "https://a.sharepoint.com/x?id=%2Fa%20b&v=1"}
  - {label: md-link-target-start, text: "[bits - OneDrive](https://a.sharepoint.com/x?id=%2Fa%20b&v=1)", cursor: 18,
     expected: "https://a.sharepoint.com/x?id=%2Fa%20b&v=1"}
  - {label: md-link-in-prose,   text: "read [my notes](~/txt/a b.txt) later", cursor: 8, expected: "~/txt/a b.txt"}
  - {label: md-link-angle-target, text: "see [docs](<~/txt/a b.txt>) here", cursor: 6, expected: "~/txt/a b.txt"}
  - {label: md-link-with-title, text: '[docs](~/txt/notes.txt "my title")', cursor: 3, expected: "~/txt/notes.txt"}
  - {label: md-link-nested-parens, text: "[wiki](https://en.wikipedia.org/wiki/Rust_(language)) x", cursor: 3,
     expected: "https://en.wikipedia.org/wiki/Rust_(language)"}
  - {label: md-link-deep-link-target, text: "[foo](~/txt/f.py:12:/^def foo/) x", cursor: 2,
     expected: "~/txt/f.py:12:/^def foo/"}
  - {label: md-link-second-of-two, text: "[a](one.txt) and [b](two.txt)", cursor: 19, expected: "two.txt"}
  - {label: md-link-outside-after, text: "[a](one.txt) and google.com", cursor: 20, expected: "google.com"}
  - {label: md-link-empty-target, text: "[a]() and google.com", cursor: 1, expected: "a"}
  # <!-- --> is a comment marker, not an angle pair, so a URL inside it still resolves
  - {label: html-comment-url, text: "<!-- published at https://sh.ncoad.com/sh/drj7heew -->", cursor: 31,
     expected: "https://sh.ncoad.com/sh/drj7heew"}
  - {label: html-comment-url-start, text: "<!-- published at https://sh.ncoad.com/sh/drj7heew -->", cursor: 18,
     expected: "https://sh.ncoad.com/sh/drj7heew"}
  - {label: html-comment-path, text: "<!-- see ~/txt/notes.txt -->", cursor: 12, expected: "~/txt/notes.txt"}
  - {label: html-comment-quoted-spacey-path, text: "<!-- see '~/a b/c.txt' -->", cursor: 12, expected: "~/a b/c.txt"}
  # a pair that opens and closes before the cursor is not an enclosing pair
  - {label: md-checkbox,       text: "- [ ] visit google.com now", cursor: 15, expected: "google.com"}
  - {label: unmatched-opener,  text: "(notes.txt and more", cursor: 3,  expected: "notes.txt"}
  # quotes wrapping a path *and* prose: the whole doesn't resolve, so the token under
  # the cursor wins — but only when it really resolves (/etc/hosts exists everywhere)
  - {label: annotated-quoted-path, text: '  - "/etc/hosts — the hosts file"', cursor: 8, expected: "/etc/hosts"}
  - {label: annotated-quoted-path-deeplink, text: '  - "/etc/hosts:3 — the hosts file"', cursor: 8,
     expected: "/etc/hosts:3"}
  - {label: annotated-quoted-cursor-in-prose, text: '  - "/etc/hosts — the hosts file"', cursor: 20,
     expected: "/etc/hosts — the hosts file"}
  - {label: annotated-quoted-unresolvable, text: '  - "/etc/nope.txt — no such file"', cursor: 8,
     expected: "/etc/nope.txt — no such file"}

  # cursor in surrounding text
  - {label: url-mid-sentence,   text: "boo google.com hoo",          cursor: 6, expected: "google.com"}
  - {label: word-at-cursor,     text: "love dog",                    cursor: 2, expected: "love"}     # cursor inside "love"
  - {label: file-in-sentence,   text: "blast notes.txt",             cursor: 7, expected: "notes.txt"}  # cursor on "notes"

  # pre-existing selection (range instead of cursor)
  - {label: selection-multiword, text: "foobar door house",  selection: [0, 11], expected: "foobar door"}

  # deep links with regex containing characters that are default get_selection delimiters
  # (* < > , etc.) — find_selection's hardcoded terminator excludes them so the whole
  # token is captured.  Regression for ~/file.txt:/^\s*http/ failing to expand.
  - {label: regex-with-asterisk, text: "~/txt/my/cmd_imsg.txt:/^\\s*http/",  cursor: 5,
     expected: "~/txt/my/cmd_imsg.txt:/^\\s*http/"}
  - {label: regex-cursor-inside-pattern, text: "~/txt/my/cmd_imsg.txt:/^\\s*http/", cursor: 28,
     expected: "~/txt/my/cmd_imsg.txt:/^\\s*http/"}
  - {label: regex-with-comma, text: "file.py:/foo,bar/", cursor: 3,  expected: "file.py:/foo,bar/"}
  - {label: regex-with-angle, text: "file.py:/<tag>/",   cursor: 3,  expected: "file.py:/<tag>/"}
  - {label: search-with-comma, text: 'file.py:"a,b,c"', cursor: 3,   expected: 'file.py:"a,b,c"'}

# ─────────────────────────────────────────────────────────────────────────────
# parse_file_location cases
# loc_type / loc_value: expected location dict fields (omit both for None)
# ─────────────────────────────────────────────────────────────────────────────
parse_cases:
  - {label: plain-file,     input: "file.py",                path: "file.py"}
  - {label: line-num,       input: "file.py:42",             path: "file.py",    loc_type: line,   loc_value: 42}
  - {label: search-str,     input: 'file.py:"hello world"',  path: "file.py",    loc_type: search, loc_value: "hello world"}
  - {label: regex-loc,      input: "file.py:/def foo/",      path: "file.py",    loc_type: regex,  loc_value: "def foo"}
  - {label: https-passthru, input: "https://example.com",    path: "https://example.com"}
  - {label: tilde-abs-line, input: "~/notes.txt:7",          path: "~/notes.txt", loc_type: line,  loc_value: 7}

# ─────────────────────────────────────────────────────────────────────────────
# _find_loc_sep cases
# line_number_only defaults to false when omitted
# ─────────────────────────────────────────────────────────────────────────────
loc_sep_cases:
  - {label: line-num,           text: "file.py:42",       expected: 7}
  - {label: search-str,         text: 'file.py:"text"',   expected: 7}
  - {label: regex,              text: "file.py:/pat/",    expected: 7}
  - {label: http-url,           text: "http://x.com",     expected: -1}
  - {label: no-sep,             text: "file.py",          expected: -1}
  - {label: line-only-ok,       text: "file.py:42",       expected: 7,  line_number_only: true}
  - {label: line-only-skip-str, text: 'file.py:"text"',   expected: -1, line_number_only: true}
  - {label: line-only-skip-re,  text: "file.py:/pat/",    expected: -1, line_number_only: true}
  # a ':' inside a regex/search body must not win the backward scan
  - {label: re-trailing-colon,  text: 'f.py:1:/^def foo\(x\):/', expected: 6}
  - {label: re-inner-colon,     text: "f.md:1:/^key: value/",    expected: 6}
  - {label: re-inner-colon-num, text: "f.md:1:/^foo:42/",        expected: 6}
  - {label: str-inner-colon,    text: 'f.md:1:"foo: bar"',       expected: 6}
  - {label: re-unterminated,    text: "f.md:/^foo",              expected: -1}
  - {label: str-unterminated,   text: 'f.md:"foo',               expected: -1}
  - {label: range-form,         text: "f.md:120-180",            expected: 4}
  - {label: digits-then-junk,   text: "f.md:42abc",              expected: -1}

# ─────────────────────────────────────────────────────────────────────────────
# _scan_line_for_url cases
# text: full line content (cursor assumed at position 0)
# expected: first URL/file token found, or null if nothing found
# ─────────────────────────────────────────────────────────────────────────────
scan_line_cases:
  - {label: url-after-label,        text: "Dream Analysis, https://claude.ai/chat/381fa171-e701-4f2d-9f89-1bb90cbb1607",                                  expected: "https://claude.ai/chat/381fa171-e701-4f2d-9f89-1bb90cbb1607"}
  - {label: url-after-long-label,   text: "Travel Flight and Hotel Itinerary Template, https://claude.ai/chat/75498511-2bdc-4d1d-8991-95bcc88de336",      expected: "https://claude.ai/chat/75498511-2bdc-4d1d-8991-95bcc88de336"}
  - {label: url-only,               text: "https://example.com/path",                                                                                      expected: "https://example.com/path"}
  - {label: no-url,                 text: "just some words no url here",                                                                                    expected: null}
  - {label: url-in-comment,         text: "# see https://example.com for docs",                                                                            expected: "https://example.com"}
  - {label: bare-domain-after-text, text: "visit google.com today",                                                                                        expected: "google.com"}
  - {label: url-mid-line,           text: "label: https://example.com more text",                                                                          expected: "https://example.com"}
